<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reading Notes｜个人阅读档案</title>
<style>
:root{--bg:#f7f5f0;--paper:#fffdf9;--ink:#252525;--muted:#77736d;--line:#e8e2d9;--accent:#7c6650}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Serif SC","Songti SC",serif;line-height:1.7}
.wrap{width:min(1100px,92%);margin:auto;padding:70px 0}.eyebrow{font:12px Arial,sans-serif;letter-spacing:3px;color:var(--accent)}h1{font-size:clamp(42px,7vw,82px);line-height:1.05;margin:16px 0}p.lead{font-size:18px;color:var(--muted);max-width:620px}.line{border:0;border-top:1px solid var(--line);margin:55px 0 30px}.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:24px}.head h2{margin:0;font-size:30px}.count{color:var(--muted);font:13px Arial,sans-serif}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px}.book{display:block;text-decoration:none;color:inherit;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:16px;transition:.2s}.book:hover{transform:translateY(-4px);box-shadow:0 14px 35px rgba(60,45,30,.1)}.book img{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:10px;background:#eee}.book h3{font-size:23px;margin:16px 0 4px}.author{color:var(--muted);font-size:14px}.tag{display:inline-block;margin-top:12px;padding:5px 10px;background:#eee7dc;border-radius:999px;color:var(--accent);font:12px Arial,sans-serif}.footer{margin-top:70px;color:var(--muted);font:13px Arial,sans-serif}
</style>
</head>
<body>
<main class="wrap">
<div class="eyebrow">PERSONAL READING ARCHIVE</div>
<h1>Reading<br>Notes.</h1>
<p class="lead">记录每一本书，也记录阅读过程中的思考、感悟与成长。</p>
<hr class="line">
<div class="head"><h2>我的书架</h2><span class="count">01 BOOK</span></div>
<div class="grid">
<a class="book" href="books/人类简史.html">
<img src="assets/covers/sapiens.png" alt="人类简史">
<h3>人类简史</h3>
<div class="author">Yuval Noah Harari</div>
<span class="tag">📖 阅读中 · 5%</span>
</a>
</div>
<div class="footer">Built with Reading Journey · 持续记录阅读的旅程</div>
</main>
</body>
</html>
